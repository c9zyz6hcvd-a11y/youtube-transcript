<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Transcript</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #888; margin-bottom: 36px; font-size: 0.95rem; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 720px;
    }

    .input-row { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #ff4e4e; }
    input[type="text"]::placeholder { color: #555; }

    button#fetch-btn {
      background: #ff4e4e;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button#fetch-btn:hover { background: #e03c3c; }
    button#fetch-btn:disabled { background: #555; cursor: not-allowed; }

    .error { margin-top: 16px; color: #ff6b6b; font-size: 0.9rem; display: none; }
    .result { margin-top: 24px; display: none; }

    /* ── Video info ── */
    .video-info {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2a2a2a;
    }
    .video-thumb {
      width: 130px;
      height: 73px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
      background: #222;
    }
    .video-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      background: #2a2a2a;
      border: 1px solid #383838;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: #aaa;
    }

    /* ── Tabs ── */
    .tab-row {
      display: flex;
      margin-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .tab {
      padding: 8px 18px;
      font-size: 0.88rem;
      cursor: pointer;
      color: #888;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .tab.active { color: #fff; border-bottom-color: #ff4e4e; }
    .tab:hover:not(.active) { color: #ccc; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    textarea {
      width: 100%;
      height: 380px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      color: #d4d4d4;
      font-size: 0.87rem;
      line-height: 1.65;
      font-family: "SF Mono", "Menlo", monospace;
      resize: vertical;
      outline: none;
    }
    #ai-output {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.92rem;
      line-height: 1.75;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #2a2a2a;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 8px 18px;
      color: #ccc;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #333; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .copied { color: #4caf50; font-size: 0.82rem; opacity: 0; transition: opacity 0.3s; margin-right: auto; }
    .copied.show { opacity: 1; }

    /* ── AI bar ── */
    .ai-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #2a2a2a;
      flex-wrap: wrap;
    }
    button#process-btn {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    button#process-btn:hover { opacity: 0.88; }
    button#process-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    select#lang-select {
      background: #2a2a2a;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 9px 14px;
      color: #ccc;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    select#lang-select:focus { border-color: #7c3aed; }

    .ai-status { font-size: 0.82rem; color: #7c6ef7; }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid #555;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── History ── */
    .history-section {
      width: 100%;
      max-width: 720px;
      margin-top: 24px;
      display: none;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .history-header h2 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .history-clear {
      background: none;
      border: none;
      color: #555;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .history-clear:hover { color: #ff6b6b; }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .history-item:hover { background: #222; border-color: #3a3a3a; }
    .history-thumb {
      width: 80px;
      height: 45px;
      border-radius: 5px;
      object-fit: cover;
      flex-shrink: 0;
      background: #222;
    }
    .history-info { flex: 1; min-width: 0; }
    .history-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-meta { font-size: 0.78rem; color: #666; margin-top: 3px; }
    .history-delete {
      background: none;
      border: none;
      color: #444;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color 0.15s;
      line-height: 1;
    }
    .history-delete:hover { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>YouTube Transcript</h1>
  <p class="subtitle">Paste any YouTube URL to extract and process its transcript.</p>

  <div class="card">
    <div class="input-row">
      <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="fetch-btn" onclick="fetchTranscript()">Transcribe</button>
    </div>

    <p class="error" id="error-msg"></p>

    <div class="result" id="result">

      <!-- Video info -->
      <div class="video-info">
        <img id="video-thumb" class="video-thumb" src="" alt="" />
        <div>
          <div class="video-title" id="video-title"></div>
          <div class="badge-row">
            <span class="badge" id="lang-badge"></span>
            <span class="badge" id="count-badge"></span>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tab-row">
        <div class="tab active" id="tab-plain" onclick="switchTab('plain')">Plain text</div>
        <div class="tab"        id="tab-ai"    onclick="switchTab('ai')">AI 整理</div>
      </div>

      <div class="tab-panel active" id="panel-plain">
        <textarea id="output-plain" readonly></textarea>
      </div>
      <div class="tab-panel" id="panel-ai">
        <textarea id="ai-output" readonly placeholder="Click ✦ AI 整理 below to start…"></textarea>
      </div>

      <div class="actions">
        <span class="copied" id="copied-msg">Copied!</span>
        <button class="btn-secondary" onclick="copyText()">Copy</button>
        <button class="btn-secondary" onclick="downloadTxt()">Download .txt</button>
        <button class="btn-secondary" id="pdf-btn" onclick="viewPdf()" style="display:none">📄 View PDF</button>
        <button class="btn-secondary" id="word-btn" onclick="downloadWord()" style="display:none">.docx</button>
      </div>

      <!-- AI bar -->
      <div class="ai-bar">
        <button id="process-btn" onclick="processTranscript()">✦ AI 整理</button>
        <select id="lang-select">
          <option value="hk">香港繁體中文</option>
          <option value="tw">台灣繁體中文</option>
          <option value="cn">簡體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <span class="ai-status" id="ai-status"></span>
      </div>
    </div>

    <div style="text-align:center;margin-top:20px;">
      <div class="spinner" id="spinner"></div>
    </div>
  </div>

  <!-- History -->
  <div class="history-section" id="history-section">
    <div class="history-header">
      <h2>Recent</h2>
      <button class="history-clear" onclick="clearHistory()">Clear all</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

  <script>
    let data = null;
    let currentTab = 'plain';
    let aiDone = false;

    // ─── History (localStorage) ──────────────────────────────────────────────

    const HISTORY_KEY = 'yt_transcript_history';
    const MAX_HISTORY = 20;

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
      catch { return []; }
    }

    function saveHistory(items) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(items));
    }

    function addToHistory(item) {
      let items = loadHistory();
      // Remove duplicate if same video_id exists
      items = items.filter(h => h.video_id !== item.video_id);
      items.unshift(item);
      if (items.length > MAX_HISTORY) items = items.slice(0, MAX_HISTORY);
      saveHistory(items);
      renderHistory();
    }

    function removeFromHistory(video_id) {
      saveHistory(loadHistory().filter(h => h.video_id !== video_id));
      renderHistory();
    }

    function clearHistory() {
      saveHistory([]);
      renderHistory();
    }

    function timeAgo(isoString) {
      const diff = Date.now() - new Date(isoString).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1)  return 'Just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)  return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function renderHistory() {
      const items   = loadHistory();
      const section = document.getElementById('history-section');
      const list    = document.getElementById('history-list');

      if (items.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';

      list.innerHTML = items.map(item => `
        <div class="history-item" onclick="loadFromHistory('${item.url}')">
          <img class="history-thumb" src="${item.thumbnail}" alt="" />
          <div class="history-info">
            <div class="history-title">${item.title || item.url}</div>
            <div class="history-meta">${item.language || ''} · ${timeAgo(item.date)}</div>
          </div>
          <button class="history-delete" onclick="event.stopPropagation(); removeFromHistory('${item.video_id}')" title="Remove">✕</button>
        </div>
      `).join('');
    }

    function loadFromHistory(url) {
      document.getElementById('url-input').value = url;
      fetchTranscript();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render on page load
    renderHistory();

    // ─── Fetch transcript ────────────────────────────────────────────────────

    async function fetchTranscript() {
      const url      = document.getElementById('url-input').value.trim();
      const btn      = document.getElementById('fetch-btn');
      const errorEl  = document.getElementById('error-msg');
      const resultEl = document.getElementById('result');
      const spinner  = document.getElementById('spinner');

      errorEl.style.display = 'none';
      resultEl.style.display = 'none';
      btn.disabled = true;
      spinner.style.display = 'block';

      aiDone = false;
      document.getElementById('ai-output').value = '';
      document.getElementById('ai-status').textContent = '';
      showExportButtons(false);

      try {
        const res  = await fetch('/transcript', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const json = await res.json();

        if (!res.ok) {
          errorEl.textContent = json.error || 'Something went wrong.';
          errorEl.style.display = 'block';
          return;
        }

        data = json;

        // Populate video info
        const thumb = document.getElementById('video-thumb');
        thumb.src = json.thumbnail || '';
        thumb.style.display = json.thumbnail ? 'block' : 'none';
        document.getElementById('video-title').textContent  = json.title || '';
        document.getElementById('lang-badge').textContent   = `Language: ${json.language}`;
        document.getElementById('count-badge').textContent  = `${json.entry_count} segments`;
        document.getElementById('output-plain').value       = json.plain;

        switchTab('plain');
        resultEl.style.display = 'block';

        // Save to history
        addToHistory({
          url:       url,
          video_id:  json.video_id,
          title:     json.title,
          thumbnail: json.thumbnail,
          language:  json.language,
          date:      new Date().toISOString(),
        });

      } catch (e) {
        errorEl.textContent = 'Network error. Is the server running?';
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
      }
    }

    // ─── Tab switching ───────────────────────────────────────────────────────

    function showExportButtons(show) {
      const d = show ? 'inline-block' : 'none';
      document.getElementById('pdf-btn').style.display  = d;
      document.getElementById('word-btn').style.display = d;
    }

    function switchTab(tab) {
      currentTab = tab;
      ['plain', 'ai'].forEach(t => {
        document.getElementById('tab-'   + t).classList.toggle('active', t === tab);
        document.getElementById('panel-' + t).classList.toggle('active', t === tab);
      });
      showExportButtons(tab === 'ai' && aiDone);
    }

    // ─── AI processing ───────────────────────────────────────────────────────

    async function processTranscript() {
      if (!data) return;

      const btn      = document.getElementById('process-btn');
      const statusEl = document.getElementById('ai-status');
      const aiOutput = document.getElementById('ai-output');
      const lang     = document.getElementById('lang-select').value;

      btn.disabled = true;
      btn.textContent = '整理中…';
      statusEl.textContent = '';
      aiOutput.value = '';
      aiDone = false;
      showExportButtons(false);

      switchTab('ai');

      try {
        const response = await fetch('/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript: data.plain, language: lang }),
        });

        if (!response.ok) {
          const json = await response.json();
          aiOutput.value = '錯誤：' + (json.error || 'Something went wrong.');
          return;
        }

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let charCount = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') {
              aiDone = true;
              showExportButtons(true);
              // Final stats: count Chinese chars + English words separately
              const fullText   = aiOutput.value;
              const zhChars    = (fullText.match(/[一-鿿]/g) || []).length;
              const enWords    = (fullText.match(/\b[a-zA-Z]+\b/g) || []).length;
              const totalWords = zhChars + enWords;
              const pages      = Math.max(1, Math.ceil(totalWords / 500));
              statusEl.textContent = `${totalWords.toLocaleString()} words · ~${pages} pages`;
              break;
            }
            try {
              const parsed = JSON.parse(payload);
              if (parsed.status) {
                statusEl.textContent = parsed.status;
              } else if (parsed.error) {
                aiOutput.value += '\n\n錯誤：' + parsed.error;
              } else if (parsed.text) {
                const clean = parsed.text.replace(/\*\*/g, '');
                aiOutput.value += clean;
                charCount += clean.length;
                statusEl.textContent = charCount + ' 字';
                aiOutput.scrollTop = aiOutput.scrollHeight;
              }
            } catch {}
          }
        }

      } catch (e) {
        aiOutput.value = 'Network error: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '✦ AI 整理';
        if (!aiDone) statusEl.textContent = '';
      }
    }

    // ─── Copy / Download ─────────────────────────────────────────────────────

    function currentText() {
      return currentTab === 'ai'
        ? document.getElementById('ai-output').value
        : document.getElementById('output-plain').value;
    }

    function copyText() {
      navigator.clipboard.writeText(currentText()).then(() => {
        const msg = document.getElementById('copied-msg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 1800);
      });
    }

    function downloadTxt() {
      const suffix = currentTab === 'ai' ? '-ai' : '-plain';
      const blob = new Blob([currentText()], { type: 'text/plain; charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `transcript-${data.video_id}${suffix}.txt`;
      a.click();
    }

    // Open the PDF inline in a new tab — works reliably on phones.
    // Uses a form POST so the (large) text isn't crammed into a URL.
    function viewPdf() {
      const text = document.getElementById('ai-output').value;
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/view/pdf';
      form.target = '_blank';
      const fields = { text, title: data.title || 'Transcript', video_id: data.video_id || '' };
      for (const [k, v] of Object.entries(fields)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = v;
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    async function downloadWord() {
      const text = document.getElementById('ai-output').value;
      const res  = await fetch('/download/word', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, title: data.title, video_id: data.video_id }),
      });
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${data.title || 'transcript'}.docx`;
      a.click();
    }

    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchTranscript();
    });
  </script>
</body>
</html>
